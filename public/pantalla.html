<!DOCTYPE html>
<!-- Indicamos que el documento usa HTML5 -->

<html lang="es">
<!-- Comienza el documento HTML y especificamos que está en español -->

<head>
  <meta charset="UTF-8">
  <!-- Codificación UTF-8 -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Hacemos que se adapte bien a pantallas móviles -->

  <title>Pantalla principal - Navegación</title>
  <!-- Título de la pestaña -->

  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Estilos de Leaflet Routing Machine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <!-- Nuestro CSS general -->
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/pantalla.css">

</head>

<body class="modo-2d">
  <div id="arContainer" class="oculto">
    <video id="arVideo" autoplay playsinline></video>     <!-- Video de la cámara -->
    <canvas id="arCanvas"></canvas>                       <!-- Canvas para dibujar sobre el video -->
  </div>

  <!-- Menú lateral flotante -->
  <button id="menuToggle" class="menu-toggle">☰</button>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2>Opciones</h2>
      <button id="closeSidebar" class="close-btn">&times;</button>
    </div>
    <div style="padding: 0 20px;">
      <button id="btnProfile" class="btn-primario" style="width: 100%; margin-top: 0; margin-bottom: 20px;">Mi Perfil</button>
    </div>

    <!-- Modulo de Navegación -->
    <div class="sidebar-section">
      <h3>Navegación</h3>
      <input type="text" id="destinoInput" class="input-moderno" placeholder="Ej: Museo del Prado, Madrid">
      <button id="btnRuta" class="btn-primario">Buscar y calcular ruta</button>
      
      <!-- Checkbox para activar el modo de destino en mapa -->
      <label class="click-mode-label">
        <input type="checkbox" id="clickMode"> Destino en mapa con clic
      </label>
      
      <button id="btnAR" class="btn-ar oculto">Activar Cámara AR</button>
      <!-- Botón para activar el modo AR (estará oculto al principio) -->

      <!-- Estado de la ruta -->
      <div id="estadoRuta" class="status-box">Obteniendo tu ubicación...</div>
      
      <!-- Paso actual de la ruta -->
      <div id="stepBox" class="step-box">Todavía no hay una ruta calculada.</div>
    </div>

    <!-- Modulo Multidispositivo -->
    <div class="sidebar-section">
      <h3>Mis Contactos</h3>
      <label class="click-mode-label" style="margin-top: 5px;">
        <input type="checkbox" id="shareLocationMode">
        Mostrar y compartir con amigos
      </label>
      <div id="contactosList" class="contactos-list">
        <p class="no-contacts-msg">Activa compartir para ver contactos.</p>
      </div>
    </div>

    <!-- Modulo de Controles (Botones visuales no funcionales) -->
    <div class="sidebar-section">
      <h3>Controles</h3>
      <div class="column-controls">
        <button class="btn-control" data-event="prevStep">Paso anterior</button>
        <button class="btn-control" data-event="nextStep">Paso Siguiente</button>
        <button class="btn-control" data-event="zoomIn">Zoom +</button>
        <button class="btn-control" data-event="zoomOut">Zoom -</button>
        <button class="btn-control" data-event="toggleMode">2D/3D</button>
        <button class="btn-control" data-event="deleteRoute">Eliminar ruta</button>
        <button class="btn-control" data-event="recenter">Recentrar</button>
      </div>
    </div>
    
    <!-- Elementos ocultos para que el JS no lance error -->
    <div style="display:none;">
      <p id="connectionStatus"></p>
      <p id="lastEvent"></p>
      <p id="modeStatus"></p>
    </div>
  </aside>

  <!-- Contenedor del mapa -->
  <div id="mapa"></div>

  <!-- Modal Mi Perfil -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" id="closeProfileModal">&times;</span>
      <h2 style="margin-top: 0; color: #2c3e50;">Mi Perfil</h2>
      
      <div class="profile-header">
        <img id="myProfileAvatar" src="" alt="Mi Avatar" class="profile-avatar">
        <div style="flex: 1;">
          <h3 id="myProfileName" style="margin:0 0 10px 0; color:#34495e;"></h3>
          <input type="file" id="avatarFileInput" accept="image/*" style="font-size: 12px; margin-bottom: 5px;">
          <button id="btnChangeAvatar" class="btn-primario" style="font-size: 12px; padding: 8px;">Guardar Foto</button>
        </div>
      </div>
      
      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
      
      <h3 style="color: #34495e; font-size: 16px;">Buscar Amigos</h3>
      <div style="display: flex; gap: 5px; margin-bottom: 10px; align-items: center;">
        <input type="text" id="searchFriendInput" class="input-moderno" placeholder="Nombre de usuario..." style="flex:1; margin-bottom:0;">
        <button id="btnSearchFriend" class="btn-primario" style="padding: 10px 15px; width: auto; white-space: nowrap;">Buscar</button>
      </div>
      <div id="searchResults" class="contactos-list" style="max-height: 120px; overflow-y: auto;"></div>
      
      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
      
      <h3 style="color: #34495e; font-size: 16px;">Mis Amigos (<span id="friendsCount">0</span>)</h3>
      <div id="myFriendsList" class="contactos-list" style="max-height: 150px; overflow-y: auto;">
      </div>

    </div>
  </div>

  <!-- Librería de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Librería de Leaflet Routing Machine -->
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

  <!-- Cliente de Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Nuestros JS -->
  <script src="/js/pantalla.js"></script>
  <script src="/js/ar.js"></script>
</body>
</html>
