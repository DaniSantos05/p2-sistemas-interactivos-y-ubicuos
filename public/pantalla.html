<!DOCTYPE html>
<!-- Indicamos que el documento usa HTML5 -->

<html lang="es">
<!-- Comienza el documento HTML y especificamos que está en español -->

<head>
  <meta charset="UTF-8">
  <!-- Codificación UTF-8 -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Hacemos que se adapte bien a pantallas móviles -->

  <title>Pantalla principal - Navegación</title>
  <!-- Título de la pestaña -->

  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Estilos de Leaflet Routing Machine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <!-- Nuestro CSS general -->
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/pantalla.css">

</head>

<body class="modo-2d">
  <div id="arContainer" class="oculto">
    <video id="arVideo" autoplay playsinline></video>     <!-- Video de la cámara -->
    <canvas id="arCanvas"></canvas>                       <!-- Canvas para dibujar sobre el video -->
  </div>

  <!-- Menú lateral flotante -->
  <button id="menuToggle" class="menu-toggle">☰</button>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2>Opciones</h2>
      <button id="closeSidebar" class="close-btn">&times;</button>
    </div>

    <!-- Modulo de Navegación -->
    <div class="sidebar-section">
      <h3>Navegación</h3>
      <input type="text" id="destinoInput" class="input-moderno" placeholder="Ej: Museo del Prado, Madrid">
      <button id="btnRuta" class="btn-primario">Buscar y calcular ruta</button>
      
      <!-- Checkbox para activar el modo de destino en mapa -->
      <label class="click-mode-label">
        <input type="checkbox" id="clickMode">
        Destino en mapa con clic
      </label>
      
      <button id="btnAR" class="btn-ar oculto">Activar Cámara AR</button>
      <!-- Botón para activar el modo AR (estará oculto al principio) -->

      <!-- Estado de la ruta -->
      <div id="estadoRuta" class="status-box">Obteniendo tu ubicación...</div>
      
      <!-- Paso actual de la ruta -->
      <div id="stepBox" class="step-box">Todavía no hay una ruta calculada.</div>
    </div>

    <!-- Modulo de Controles (Botones visuales no funcionales) -->
    <div class="sidebar-section">
      <h3>Controles</h3>
      <div class="column-controls">
        <button class="btn-control" data-event="prevStep">Paso anterior</button>
        <button class="btn-control" data-event="nextStep">Paso Siguiente</button>
        <button class="btn-control" data-event="zoomIn">Zoom +</button>
        <button class="btn-control" data-event="zoomOut">Zoom -</button>
        <button class="btn-control" data-event="toggleMode">2D/3D</button>
        <button class="btn-control" data-event="deleteRoute">Eliminar ruta</button>
        <button class="btn-control" data-event="recenter">Recentrar</button>
      </div>
    </div>
    
    <!-- Elementos ocultos para que el JS no lance error -->
    <div style="display:none;">
      <p id="connectionStatus"></p>
      <p id="lastEvent"></p>
      <p id="modeStatus"></p>
    </div>
  </aside>

  <!-- Contenedor del mapa -->
  <div id="mapa"></div>

  <!-- Librería de Leaflet -->
  <!-- Esta librería la utilizamos para crear el mapa-->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Librería de Leaflet Routing Machine -->
  <!-- Esta librería la utilizamos para calcular la ruta-->
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

  <!-- Cliente de Socket.IO -->
  <!-- Esta librería la utilizamos para comunicarnos con el servidor-->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Nuestros JS -->
  <!-- Este es nuestro script que contiene la lógica general de la aplicación-->
  <script src="/js/pantalla.js"></script>
  <!-- Este es nuestro script que contiene la lógica de Realidad Aumentada-->
  <script src="/js/ar.js"></script>
</body>
</html>
