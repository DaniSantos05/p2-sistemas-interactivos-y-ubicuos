<!DOCTYPE html>
<!-- Indicamos que el documento usa HTML5 -->

<html lang="es">
<!-- Comienza el documento HTML y especificamos que está en español -->

<head>
  <meta charset="UTF-8">
  <!-- Codificación UTF-8 -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Hacemos que se adapte bien a pantallas móviles -->

  <title>Pantalla principal - Navegación</title>
  <!-- Título de la pestaña -->

  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Estilos de Leaflet Routing Machine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <!-- Google Material Symbols (iconos vectoriales gratuitos) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <!-- Nuestro CSS general -->
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/pantalla.css">

</head>

<body class="modo-2d">
  <div id="arContainer" class="oculto">
    <video id="arVideo" autoplay playsinline></video>     <!-- Video de la cámara -->
    <canvas id="arCanvas"></canvas>                       <!-- Canvas para dibujar sobre el video -->
  </div>

  <!-- Interfaz Flotante Superior -->
  <div class="top-floating-ui">
    <div class="search-container-modern">
      <input type="text" id="destinoInput" class="search-input-modern" placeholder="Ej: Museo del Prado, Madrid" autocomplete="off">
      <button id="btnRuta" class="btn-search-modern">
        <span class="material-symbols-outlined">search</span>
      </button>
    </div>
    
    <button id="btnMenuToggle" class="profile-toggle-btn">
      <img id="btnAvatarIcon" src="https://ui-avatars.com/api/?name=U&rounded=true&size=128" alt="Perfil" class="btn-avatar-icon">
    </button>
  </div>

  <!-- Menú de Pantalla Completa (Estilo Google Maps) -->
  <div id="fullScreenMenu" class="fullscreen-menu oculto">
    <div class="fsm-content">
      <div class="fsm-header">
        <button id="closeFullScreen" class="close-fsm-btn">&times;</button>
        <div class="fsm-profile-banner">
          <img id="fsmAvatar" src="" alt="Mi Avatar" class="fsm-avatar-large">
          <div class="fsm-profile-info">
            <h2 id="fsmName">Nombre</h2>
            <button id="btnProfile" class="fsm-view-profile-btn">Ver perfil</button>
          </div>
        </div>
      </div>

      <div class="fsm-body">
        <!-- Navegación y Rutas -->
        <div class="fsm-section">
          <h3>Ruta Actual</h3>
          <div id="estadoRuta" class="fsm-status-text">Obteniendo tu ubicación...</div>
          <div id="stepBox" class="fsm-step-box">Todavía no hay una ruta calculada.</div>
          
          <label class="fsm-toggle">
            <input type="checkbox" id="clickMode">
            <div class="fsm-toggle-slider"></div>
            Destino en mapa con clic
          </label>

          <button id="btnAR" class="btn-fsm-action oculto" style="margin-top: 15px; background: #eb1f5a; color: white;">Activar Cámara AR</button>
        </div>

        <!-- Mis Contactos -->
        <div class="fsm-section">
          <h3>Mis Contactos</h3>
          <label class="fsm-toggle" style="margin-top: 10px;">
            <input type="checkbox" id="shareLocationMode">
            <div class="fsm-toggle-slider"></div>
            Mostrar y compartir ubicación con amigos
          </label>
          <div id="contactosList" class="fsm-contact-list">
            <p class="no-contacts-msg" style="color: #bbb;">Activa compartir para ver contactos.</p>
          </div>
        </div>

        <!-- Controles -->
        <div class="fsm-section">
          <h3>Ajustes / Controles</h3>
          <div class="fsm-controls-grid">
            <button class="fsm-action-btn" data-event="zoomIn">Zoom +</button>
            <button class="fsm-action-btn" data-event="zoomOut">Zoom -</button>
            <button class="fsm-action-btn" data-event="toggleMode">2D/3D</button>
            <button class="fsm-action-btn" data-event="deleteRoute">Eliminar ruta</button>
            <button class="fsm-action-btn" data-event="recenter">Recentrar</button>
          </div>
        </div>
        
      </div>
    </div>
    
    <!-- Elementos ocultos para que el JS no lance error -->
    <div style="display:none;">
      <p id="connectionStatus"></p>
      <p id="lastEvent"></p>
      <p id="modeStatus"></p>
    </div>
  </div>

  <!-- Contenedor del mapa -->
  <div id="mapa"></div>

  <!-- Tarjeta inferior de ruta (aparece tras calcular ruta) -->
  <div id="routeCard" class="route-card oculto">
    <div class="route-card-header">
      <div class="route-card-info">
        <span id="routeCardTime" class="route-card-time">--</span>
        <span id="routeCardDist" class="route-card-dist">-- km</span>
      </div>
      <button id="routeCardClose" class="route-card-close">&times;</button>
    </div>
    <div id="routeCardStep" class="route-card-step">Calculando...</div>
    <div class="route-card-actions">
      <button id="routeCardShare" class="route-card-btn route-card-btn-share">
        <span class="material-symbols-outlined">share</span> Compartir
      </button>
      <button id="routeCardAR" class="route-card-btn route-card-btn-ar">
        <span class="material-symbols-outlined">photo_camera</span> AR
      </button>
      <button id="routeCardGo" class="route-card-btn route-card-btn-go">
        <span class="material-symbols-outlined">navigation</span> Ir
      </button>
    </div>
    <!-- Navegación de pasos (visible tras pulsar Ir) -->
    <div id="routeCardNav" class="route-card-nav oculto">
      <button id="routeCardPrev" class="route-nav-btn"><span class="material-symbols-outlined">chevron_left</span> Anterior</button>
      <button id="routeCardNext" class="route-nav-btn">Siguiente <span class="material-symbols-outlined">chevron_right</span></button>
    </div>
  </div>

  <!-- Botón flotante recentrar -->
  <button id="btnRecenter" class="floating-btn floating-btn-recenter" title="Recentrar">
    <span class="material-symbols-outlined">my_location</span>
  </button>

  <!-- Modal Mi Perfil -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" id="closeProfileModal">&times;</span>
      <h2 style="margin-top: 0; color: #2c3e50;">Mi Perfil</h2>
      
      <div class="profile-header">
        <img id="myProfileAvatar" src="" alt="Mi Avatar" class="profile-avatar">
        <div style="flex: 1;">
          <h3 id="myProfileName" style="margin:0 0 10px 0; color:#34495e;"></h3>
          <input type="file" id="avatarFileInput" accept="image/*" style="font-size: 12px; margin-bottom: 5px;">
          <button id="btnChangeAvatar" class="btn-primario" style="font-size: 12px; padding: 8px;">Guardar Foto</button>
        </div>
      </div>
      
      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
      
      <h3 style="color: #34495e; font-size: 16px;">Buscar Amigos</h3>
      <div style="display: flex; gap: 5px; margin-bottom: 10px; align-items: center;">
        <input type="text" id="searchFriendInput" class="input-moderno" placeholder="Nombre de usuario..." style="flex:1; margin-bottom:0;">
        <button id="btnSearchFriend" class="btn-primario" style="padding: 10px 15px; width: auto; white-space: nowrap;">Buscar</button>
      </div>
      <div id="searchResults" class="contactos-list" style="max-height: 120px; overflow-y: auto;"></div>
      
      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
      
      <h3 style="color: #34495e; font-size: 16px;">Mis Amigos (<span id="friendsCount">0</span>)</h3>
      <div id="myFriendsList" class="contactos-list" style="max-height: 150px; overflow-y: auto;">
      </div>

    </div>
  </div>

  <!-- Librería de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Librería de Leaflet Routing Machine -->
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

  <!-- Cliente de Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Nuestros JS -->
  <script src="/js/pantalla.js"></script>
  <script src="/js/ar.js"></script>
</body>
</html>
