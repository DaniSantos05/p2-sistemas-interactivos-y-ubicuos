<!DOCTYPE html>
<!-- Indicamos que el documento usa HTML5 -->

<html lang="es">
<!-- Comienza el documento HTML y especificamos que está en español -->

<head>
  <meta charset="UTF-8">
  <!-- Codificación UTF-8 -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Hacemos que se adapte bien a pantallas móviles -->

  <title>Pantalla principal - Navegación</title>
  <!-- Título de la pestaña -->

  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Estilos de Leaflet Routing Machine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <!-- Google Material Symbols (iconos vectoriales gratuitos) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <!-- Nuestro CSS general -->
    <link rel="stylesheet" href="/css/styles.css?v=4">
    <link rel="stylesheet" href="/css/pantalla.css?v=4">
</head>

<body class="modo-2d">
  <div id="contenedorAR" class="oculto">
    <video id="videoAR" autoplay playsinline></video>     <!-- Video de la cámara -->
    <canvas id="canvasAR"></canvas>                       <!-- Canvas para dibujar sobre el video -->
  </div>

  <!-- Interfaz Flotante Superior -->
  <div class="top-floating-ui">
    <div class="search-container-modern">
      <input type="text" id="inputDestino" class="search-input-modern" placeholder="Ej: Museo del Prado, Madrid" autocomplete="off">
      <button id="btnRuta" class="btn-search-modern">
        <span class="material-symbols-outlined">search</span>
      </button>
    </div>
    
    <button id="btnMenuToggle" class="profile-toggle-btn">
      <img id="btnAvatarIcon" src="https://ui-avatars.com/api/?name=U&rounded=true&size=128" alt="Perfil" class="btn-avatar-icon">
    </button>
  </div>

  <!-- Desplegable en el mapa con controles -->
   <div id="mapaControles" class="mapa-controles">
     <button id="btnDesplegarControles" class="btn-control-flotante principal">
       <span class="material-symbols-outlined">tune</span>
     </button>
     
     <div id="opcionesDesplegables" class="opciones-desplegables oculto">
       <!-- Zoom In -->
       <button class="btn-control-flotante" onclick="if(typeof zoomIn === 'function') { zoomIn(); } else if(typeof mapa !== 'undefined') { mapa.zoomIn(); }" title="Zoom +">
         <span class="material-symbols-outlined">add</span>
       </button>
       <!-- Zoom Out -->
       <button class="btn-control-flotante" onclick="if(typeof zoomOut === 'function') { zoomOut(); } else if(typeof mapa !== 'undefined') { mapa.zoomOut(); }" title="Zoom -">
         <span class="material-symbols-outlined">remove</span>
       </button>
       <!-- Recentrar -->
       <button class="btn-control-flotante" onclick="if(typeof recentrarMapa === 'function') recentrarMapa()" title="Recentrar">
         <span class="material-symbols-outlined">my_location</span>
       </button>
       <!-- Capas (Alterna entre Claro, Oscuro y Satélite a medida que pulsas) -->
       <button class="btn-control-flotante" onclick="if(typeof cambiarCapa === 'function') cambiarCapa()" title="Capas">
         <span class="material-symbols-outlined">layers</span>
       </button>
     </div>
   </div>

  <!-- Menú de Pantalla Completa (Estilo Google Maps) -->
  <div id="menuOpciones" class="menu-pantalla-completa oculto">
    <div class="contenido-menu">
      <div class="cabecera-menu">
        <button id="cerrarMenuOpciones" class="btn-cerrar-menu">&times;</button>
        <div class="banner-perfil">
          <img id="avatarMenu" src="" alt="Mi Avatar" class="avatar-grande">
          <div class="info-perfil">
            <h2 id="nombreMenu">Nombre</h2>
            <button id="btnPerfil" class="btn-ver-perfil">Ver perfil</button>
          </div>
        </div>
      </div>

      <div class="cuerpo-menu">
        <!-- Navegación y Rutas -->
        <div class="seccion-menu">
          <h3>Ruta Actual</h3>
          <div id="estadoRuta" class="texto-estado">Obteniendo tu ubicación...</div>
          <div id="cajaPasos" class="caja-pasos">Todavía no hay una ruta calculada.</div>
          <label class="interruptor-menu">
            <input type="checkbox" id="modoContadorPasos">
            <div class="interruptor-menu-slider"></div>
            Contador de pasos
          </label>
          <div id="resumenContadorRuta" class="resumen-contador-ruta">
            Pasos: 0 · Calorías: 0 kcal
          </div>
          
          <label class="interruptor-menu">
            <input type="checkbox" id="modoClic">
            <div class="interruptor-menu-slider"></div>
            Destino en mapa con clic
          </label>

          <button id="btnAR" class="btn-accion-menu oculto" style="margin-top: 15px; background: #eb1f5a; color: white;">Activar Cámara AR</button>
        </div>

        <!-- Mis Contactos -->
        <div class="seccion-menu">
          <h3>Mis Contactos</h3>
          <label class="interruptor-menu" style="margin-top: 10px;">
            <input type="checkbox" id="modoCompartirUbicacion">
            <div class="interruptor-menu-slider"></div>
            Mostrar y compartir ubicación con amigos
          </label>
          <div id="contactosList" class="lista-contactos-menu">
            <p class="no-contacts-msg" style="color: #bbb;">Activa compartir para ver contactos.</p>
          </div>
        </div>
        
      </div>
    </div>
    
    <!-- Elementos ocultos para que el JS no lance error -->
    <div style="display:none;">
      <p id="estadoConexion"></p>
      <p id="ultimoEvento"></p>
      <p id="estadoModo"></p>
    </div>
  </div>

  <!-- Contenedor del mapa -->
  <div id="mapa"></div>

  <!-- Tarjeta inferior de ruta (aparece tras calcular ruta) -->
  <div id="tarjetaRuta" class="tarjeta-ruta oculto">
    <div class="tarjeta-ruta-header">
      <div class="tarjeta-ruta-info">
        <span id="tiempoTarjetaRuta" class="tarjeta-ruta-time">--</span>
        <span id="distanciaTarjetaRuta" class="tarjeta-ruta-dist">-- km</span>
      </div>
      <button id="cerrarTarjetaRuta" class="tarjeta-ruta-close">&times;</button>
    </div>
    <div id="pasoTarjetaRuta" class="tarjeta-ruta-step">Calculando...</div>
    <div class="tarjeta-ruta-actions">
      <button id="compartirTarjetaRuta" class="tarjeta-ruta-btn tarjeta-ruta-btn-share">
        <span class="material-symbols-outlined">share</span> Compartir
      </button>
      <button id="btnARTarjetaRuta" class="tarjeta-ruta-btn tarjeta-ruta-btn-ar">
        <span class="material-symbols-outlined">photo_camera</span> AR
      </button>
      <button id="irTarjetaRuta" class="tarjeta-ruta-btn tarjeta-ruta-btn-go">
        <span class="material-symbols-outlined">navigation</span> Ir
      </button>
    </div>
    <!-- Navegación de pasos (visible tras pulsar Ir) -->
  </div>

  <!-- Modal Mi Perfil -->
  <div id="modalPerfil" class="modal">
    <div class="modal-content">
      <span class="close-modal" id="cerrarModalPerfil">&times;</span>
      <h2 style="margin-top: 0; color: #2c3e50;">Mi Perfil</h2>
      
      <div class="profile-header">
        <img id="avatarMiPerfil" src="" alt="Mi Avatar" class="profile-avatar">
        <div style="flex: 1;">
          <h3 id="nombreMiPerfil" style="margin:0 0 10px 0; color:#34495e;"></h3>
          <input type="file" id="inputArchivoAvatar" accept="image/*" style="font-size: 12px; margin-bottom: 5px;">
          <button id="btnCambiarAvatar" class="btn-primario" style="font-size: 12px; padding: 8px;">Guardar Foto</button>
        </div>
      </div>
      
      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
      
      <h3 style="color: #34495e; font-size: 16px;">Buscar Amigos</h3>
      <div style="display: flex; gap: 5px; margin-bottom: 10px; align-items: center;">
        <input type="text" id="inputBuscarAmigo" class="input-moderno" placeholder="Nombre de usuario..." style="flex:1; margin-bottom:0;">
        <button id="btnBuscarAmigo" class="btn-primario" style="padding: 10px 15px; width: auto; white-space: nowrap;">Buscar</button>
      </div>
      <div id="resultadosBusqueda" class="contactos-list" style="max-height: 120px; overflow-y: auto;"></div>
      
      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
      
      <h3 style="color: #34495e; font-size: 16px;">Mis Amigos (<span id="contadorAmigos">0</span>)</h3>
      <div id="listaMisAmigos" class="contactos-list" style="max-height: 150px; overflow-y: auto;">
      </div>

    </div>
  </div>

  <!-- Librería de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Librería de Leaflet Routing Machine -->
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

  <!-- Cliente de Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Nuestros JS -->
  <script src="/js/pantalla.js"></script>
  <script src="/js/ar.js"></script>
</body>
</html>
